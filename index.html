<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Update Required</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        :root {
            --bg-dark: #0b132b;
            --bg-card: rgba(15, 23, 42, 0.82);
            --neon-cyan: #00f2fe;
            --neon-blue: #2563eb;
            --neon-pink: #fe2c55;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 50%, #0a192f 100%);
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Floating Ambient Blobs */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.55;
            animation: floatMotion 12s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 320px;
            height: 320px;
            background: var(--neon-blue);
            top: -10%;
            left: -5%;
            animation-duration: 9s;
        }

        .blob-2 {
            width: 280px;
            height: 280px;
            background: var(--neon-cyan);
            bottom: -5%;
            right: -5%;
            animation-duration: 11s;
        }

        .blob-3 {
            width: 240px;
            height: 240px;
            background: var(--neon-pink);
            top: 35%;
            right: 20%;
            opacity: 0.22;
            animation-duration: 13s;
        }

        @keyframes floatMotion {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(40px, -50px) scale(1.12) rotate(90deg); }
            100% { transform: translate(-30px, 30px) scale(0.95) rotate(180deg); }
        }

        /* Update Card */
        .update-box {
            position: relative;
            z-index: 10;
            background: var(--bg-card);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 40px 30px;
            border-radius: 36px;
            text-align: center;
            width: 88%;
            max-width: 390px;
            border: 2px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 
                        0 0 25px rgba(0, 242, 254, 0.25),
                        inset 0 0 15px rgba(56, 189, 248, 0.15);
            animation: boxFloat 5s ease-in-out infinite alternate, glowPulse 4s infinite alternate;
        }

        @keyframes boxFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-10px); }
        }

        @keyframes glowPulse {
            0% { box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 20px rgba(0, 242, 254, 0.2); }
            100% { box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 35px rgba(0, 242, 254, 0.45); }
        }

        /* Animated Badge */
        .badge-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
            animation: rotateBounce 4s ease-in-out infinite;
        }

        .badge-icon svg {
            width: 34px;
            height: 34px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes rotateBounce {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.08) rotate(15deg); box-shadow: 0 0 35px rgba(0, 242, 254, 0.85); }
        }

        .version-tag {
            display: inline-block;
            padding: 4px 14px;
            background: rgba(0, 242, 254, 0.12);
            border: 1px solid rgba(0, 242, 254, 0.35);
            color: var(--neon-cyan);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00f2fe, #38bdf8, #fe2c55, #00f2fe);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGradient 6s ease infinite;
        }

        @keyframes textGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        p {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 24px;
            padding: 0 8px;
        }

        /* Bullet Points Box */
        .notice-box {
            background: rgba(2, 6, 23, 0.45);
            border: 1px dashed rgba(56, 189, 248, 0.25);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 24px;
            text-align: left;
        }

        .notice-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .notice-item:last-child {
            margin-bottom: 0;
        }

        .notice-item .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan);
            flex-shrink: 0;
        }

        /* Animated Action Button */
        .btn-update {
            display: block;
            width: 100%;
            text-decoration: none;
            padding: 15px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #00f2fe 100%);
            background-size: 200% 200%;
            color: #ffffff;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
            animation: btnShift 4s ease infinite;
        }

        @keyframes btnShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-update::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(30deg);
            animation: shimmerSweep 3.5s infinite;
        }

        @keyframes shimmerSweep {
            0% { transform: translate(-100%, -100%) rotate(30deg); }
            100% { transform: translate(100%, 100%) rotate(30deg); }
        }

        .btn-update:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 28px rgba(0, 242, 254, 0.55);
        }

        .footnote {
            margin-top: 20px;
            font-size: 11px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Ambient Glowing Blobs -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <!-- Main Card -->
    <div class="update-box">
        
        <div class="badge-icon">
            <svg viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" x2="12" y1="15" y2="3"></line>
            </svg>
        </div>

        <span class="version-tag">Mandatory Update</span>
        <h2>Update Required</h2>
        <p>A newer, faster, and more secure version of TikTok Tools is ready. Please update now to regain full access to all features.</p>

        <div class="notice-box">
            <div class="notice-item">
                <span class="dot"></span>
                <span>Enhanced AI generation servers</span>
            </div>
            <div class="notice-item">
                <span class="dot"></span>
                <span>Critical bug fixes &amp; speed boost</span>
            </div>
            <div class="notice-item">
                <span class="dot"></span>
                <span>New viral tools &amp; trend filters</span>
            </div>
        </div>

        <!-- Yahan apna direct APK / Download link paste karein -->
        <a class="btn-update" href="https://your-download-link.com" target="_blank">
            Update App Now
        </a>

        <div class="footnote">TIKTOK TOOLS SECURE</div>

    </div>

</body>
</html>
